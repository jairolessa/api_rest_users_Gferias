spring:
  application:
    name: api_users

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enable: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}

  flyway:
    enabled: ${FLYWAY_ENABLE}

jwt:
  secret: ${JWT_SECRET:Y2hhbmNlLXRoaXMtaW4tcHJvZHVjdGlvbi1hZGl0ZWMtc2VjcmV0LWtleS0yMDI2LXNwcmluZy1ib290}
  expiration: ${JWT_EXPIRATION:86400000}